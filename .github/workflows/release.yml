name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller audio_router_gui.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=$version installer.iss
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "release\AudioRouter-Setup-$version.exe" "release\AudioRouter-Setup.exe" -Force

      - name: Package portable release
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item dist\audio_router_gui.exe portable\AudioRouter.exe -Force
          Copy-Item audio_router_settings.json portable\audio_router_settings.json -Force
          Compress-Archive -Path portable\* -DestinationPath "release\AudioRouter-Portable-$version.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-router-release
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
