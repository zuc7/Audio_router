name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checks
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name audio_router_gui --icon app.ico audio_router_gui.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:APP_VERSION -replace '^v', ''
          $parts = @($version.Split('.') | ForEach-Object { [int]$_ })
          while ($parts.Count -lt 4) { $parts += 0 }
          $versionInfo = $parts[0..3] -join '.'
          $env:APP_VERSION = $version
          $env:APP_VERSION_INFO = $versionInfo
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "release\AudioRouter-Setup-$version.exe" "release\AudioRouter-Setup.exe" -Force
          Get-FileHash "release\AudioRouter-Setup.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  AudioRouter-Setup.exe" } | Set-Content release\SHA256SUMS.txt

      - name: Package portable release
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item dist\audio_router_gui.exe portable\AudioRouter.exe -Force
          Copy-Item app.ico portable\app.ico -Force
          Compress-Archive -Path portable\* -DestinationPath "release\AudioRouter-Portable-$version.zip" -Force
          Get-FileHash "release\AudioRouter-Portable-$version.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  AudioRouter-Portable-$version.zip" } | Add-Content release\SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-router-release
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: Audio Router ${{ github.ref_name }}
          body_path: CHANGELOG.md
